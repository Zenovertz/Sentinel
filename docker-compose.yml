services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      APP_NAME: SENTINEL API
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      FRONTEND_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_dev_password@db:5432/sentinel
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  sentinel_postgres_data:
